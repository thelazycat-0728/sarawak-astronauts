# Netlify build settings for the frontend (see docs/TECH_STACK.md §7).
# Settings here override the ones in the Netlify UI.

[build]
  base    = "frontend"
  command = "npm run lint && npm run build"
  publish = "dist"          # relative to base

  # Only rebuild when the frontend (or this file) changed; skips docs/backend-only commits.
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"       # match GitHub Actions CI

# React Router: serve index.html for client-side routes like /explore.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
