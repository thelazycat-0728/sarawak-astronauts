# Keeps the free Render API (sarawak-api) awake. Render puts free web services to
# sleep after about 15 minutes without traffic, and the first request after that
# takes 30-60 s, so this pings the cheap /health route every 10 minutes.
#
# Notes (see docs/TECH_STACK.md §7):
# - GitHub runs scheduled workflows on a best-effort basis: runs can start late
#   or be skipped when Actions is busy, so the API may still sleep now and then.
# - Schedules only run from the default branch, and GitHub disables them after
#   60 days without repository activity (re-enable in the Actions tab).
# - Always-on uses about 720-744 of the 750 free Render instance hours a month,
#   so don't add a second free web service to the same Render workspace.
# - To stop it, disable this workflow in the Actions tab or delete this file.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: https://sarawak-api.onrender.com/health
        # A sleeping service can take up to a minute to answer, so allow 90 s and
        # retry a few times before reporting a failure.
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --output /dev/null --write-out "HTTP %{http_code} in %{time_total}s\n" \
            "$HEALTH_URL"
