# Render Blueprint for the Python science API and the frontend static site
# (see docs/TECH_STACK.md §7). Create once in the Render dashboard:
# New → Blueprint → select this repo. After that, every push to main redeploys
# both services automatically.

services:
  - type: web
    name: sarawak-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_MODE
        value: irsa
      - key: CORS_ORIGINS
        sync: false   # set in the dashboard, e.g. https://sarawak-frontend.onrender.com
      # Netlify deploy previews (one per pull request) may call the API too.
      - key: CORS_ORIGIN_REGEX
        value: ^https://deploy-preview-\d+--aesthetic-parfait-36a9c2\.netlify\.app$
      # AI explainer (POST /explain), Google Gemini free tier. The key is a secret:
      # set it in the dashboard (free from https://aistudio.google.com). Empty = off.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL   # used when the main model is busy
        value: gemini-3.5-flash-lite

  # Frontend (React + Vite) as a free static site. Replaces Netlify, whose free
  # credits ran out. Static sites don't sleep, unlike the free API service.
  - type: web
    name: sarawak-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run lint && npm run build
    staticPublishPath: dist          # relative to rootDir
    autoDeploy: true
    buildFilter:                     # skip rebuilds for backend- or docs-only commits
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION            # match GitHub Actions CI
        value: "22"
      - key: VITE_API_URL            # baked in at build time: https://<api>.onrender.com
        sync: false
    routes:
      - type: rewrite                # React Router: serve index.html for /learn, /play, ...
        source: /*
        destination: /index.html
