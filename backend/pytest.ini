[pytest]
testpaths = tests
# Live tests call real archives; they only run with: python -m pytest -m live
addopts = -ra -m "not live"
markers =
    live: calls real external services (IRSA); deselected by default
filterwarnings =
    # Starlette 1.x prefers httpx2 for its TestClient; httpx still works.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
